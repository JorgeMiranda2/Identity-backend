spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:mariadb://localhost:3306/login_template?allowPublicKeyRetrieval=true&useSSL=false
    username: identity-user
    password: secret
    driver-class-name: org.mariadb.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    jwt:
      secret: ${SECRET_KEY_JAVA_IDENTIFY:xQvA4tJxgYzK5Pq7mR9uW2F8aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890AbCdEf}
      expiration: 86400000
    default-role-code: ${DEFAULT_ROLE_CODE_IDENTIFY:USER}

institution:
  email:
    domain: example.com

logging:
  level:
    org.springframework.security: DEBUG
